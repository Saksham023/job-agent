spring:
  application:
    name: jobagent
  ai:
    mcp:
      server:
        name: job-agent
        version: 0.1.0
        protocol: STREAMABLE
        instructions: >
          Searches live job postings crawled from company careers sites in India and ranks them against
          a candidate's profile. Never guess the candidate's location preference from their resume: ask.
          Each search saves the resume facts as a profile with an id (like p-7k3x9q2m); tell the candidate the
          id, and when they give one, search with profileId instead of reading the resume again.

  datasource:
    url: jdbc:postgresql://localhost:5433/jobagent
    username: ${JOBAGENT_DB_USER:postgres}
    password: ${JOBAGENT_DB_PASSWORD:ragpass}
    hikari:
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 90s   # how long a stopping app may take to wind down (crawls record their run first)

jobagent:
  matching:
    country: IN
    years-below: 2        # default experience window: a job's range must reach down to years - 2 ...
    years-above: 1        # ... and start at most years + 1 (2 years -> jobs overlapping 0 to 3)
    round-up-from: 0.5    # 1.5 years -> 2, 1.4 -> 1
  search:
    first-batch: 10       # candidates judged before the first answer (in parallel)
    ready-target: 15      # the background judge keeps this many APPLY jobs ready, refilling after each more_jobs
    stop-after-nos: 20    # ...and stops for good after this many NO verdicts in a row
    parallelism: 4
    page-size: 10         # jobs per answer when not asked for a number
    max-page-size: 25
    model: opus
  crawl:
    detail-max-age-days: 7      # a known job's stored detail is reused unless its list entry changed or it is older
    schedule:
      enabled: false            # OFF for now (user, 2026-10-06): turn on when deployed; manual POST /admin/crawl works
      cron: "0 0 */6 * * *"     # every 6 hours (00:00, 06:00, 12:00, 18:00); one virtual thread per server
      gap-fill: true            # afterwards the model fills the new jobs' gaps (only jobs never asked)
      gap-fill-model: opus
      gap-fill-parallelism: 10
      close-after-misses: 2     # a job missing from 2 good crawls of its company in a row is closed
  skills:
    learning:
      enabled: false            # OFF by default: when true, the run below happens daily (manual: POST /admin/skills/learn)
      cron: "0 30 3 * * *"      # daily 03:30, after the 00:00 crawl
      min-companies: 3          # a word must show up in skill lists at 3+ different companies before Opus is asked
      max-terms-per-run: 300    # cost cap: at most 300 words to Opus per run (~$2)
      batch-size: 20            # words per Opus call
      parallelism: 4
      model: opus
  security:
    api-key: ${JOBAGENT_SECURITY_API_KEY:}   # shared secret for /admin/** and /mcp; blank = open (set it before exposing the app)
    rate-limit:                              # /api/** only, per client, in memory
      requests-per-minute: 120               # sustained rate; 0 = no limit
      burst: 30                              # requests allowed at once
      client-ip-header: ${JOBAGENT_CLIENT_IP_HEADER:}   # behind a proxy/tunnel, e.g. CF-Connecting-IP; blank = the connection's address
  shutdown:
    wait-seconds: 60                         # on a stop (deploy, restart) running crawls get this long to save and record their run
  web:
    dir: ${JOBAGENT_WEB_DIR:}                # folder with the built web UI (web/dist) to serve at /; blank = not served
  gap-fill:
    # Opus fills missing fields (years, family, main language) only for jobs in these families (primary or
    # secondary). Every job is still crawled and run through the rules; other families just keep their gaps.
    families: [SOFTWARE_ENGINEERING, DATA_ML, INFRA_DEVOPS, UNCLASSIFIED]

server:
  port: 8080
  shutdown: graceful          # requests in flight finish before the web server stops

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never       # the health check is public: status only, no database or disk details

logging:
  level:
    io.github.saksham023.jobagent: DEBUG