spring:
  application:
    name: jobagent

  datasource:
    url: jdbc:postgresql://localhost:5433/jobagent
    username: ${JOBAGENT_DB_USER:postgres}
    password: ${JOBAGENT_DB_PASSWORD:ragpass}
    hikari:
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.github.saksham023.jobagent: DEBUG