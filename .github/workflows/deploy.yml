# Push to main: test and build on GitHub's machine, then deploy on the home server (the MacBook Air runs a
# self-hosted runner). Triggered ONLY by pushes to main and by hand, never by pull requests: the Air must not run
# code from strangers.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false      # a running deploy finishes; the next push waits

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Unit tests
        run: ./mvnw -B -q test -Dtest='*Test'

      - name: Build the jar
        run: ./mvnw -B -q package -DskipTests

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Assemble the release
        run: |
          mkdir -p release
          cp "$(find target -maxdepth 1 -name 'jobagent-*.jar' ! -name '*.original' | head -1)" release/jobagent.jar
          cp -r web/dist release/web
          cp deploy/deploy.sh release/deploy.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Deploy
        run: bash release/deploy.sh release
